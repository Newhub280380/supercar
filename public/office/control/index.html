<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CONTROL CENTER // статистика</title>
<link rel="stylesheet" href="../shared/theme.css">
<style>
  main { padding: 26px 0 0; }
  .kpis { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); margin-bottom: 18px; }
  .charts { display: grid; gap: 18px; grid-template-columns: 1.4fr 1fr; align-items: start; }
  @media (max-width: 980px) { .charts { grid-template-columns: 1fr; } }
  canvas { width: 100%; height: auto; display: block; }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 10px; font-family: var(--mono); font-size: 12px; color: var(--dim); }
  .legend i { display: inline-block; width: 10px; height: 10px; margin-right: 6px; border-radius: 2px; }
  .bars { display: grid; gap: 8px; }
  .bar { display: grid; grid-template-columns: 150px 1fr 60px; gap: 10px; align-items: center; font-size: 14px; }
  .bar .track { display: block; height: 14px; background: #0c1417; border: 1px solid var(--line);
                border-radius: 3px; overflow: hidden; }
  .bar .fill { display: block; height: 100%; background: linear-gradient(90deg, var(--neon), var(--cyan)); }
  .bar .n { text-align: right; font-variant-numeric: tabular-nums; }
  #leads { margin-top: 18px; }
</style>
</head>
<body>

<main class="wrap">
  <h1 style="color:var(--neon)">CONTROL CENTER</h1>
  <p class="dim mono" id="src">загрузка показателей из CRM…</p>

  <div class="kpis" id="kpis"></div>

  <div class="charts">
    <section class="card">
      <h2>ДЕНЬГИ ПО МЕСЯЦАМ</h2>
      <canvas id="rev" width="900" height="380"></canvas>
      <div class="legend">
        <span><i style="background:#00ffcc"></i>приход по проведённым визитам</span>
      </div>
    </section>

    <section class="card">
      <h2>ВОРОНКА</h2>
      <div class="bars" id="funnel"></div>
      <h2 style="margin-top:22px">ЗАПИСИ ЗА 7 ДНЕЙ</h2>
      <div class="bars" id="top"></div>
    </section>
  </div>

  <section class="card" id="leads">
    <h2>ЛИДЫ РАДАРА</h2>
    <div id="leads-body" class="dim">файл leads.json не найден рядом со страницей — запустите
      <span class="mono">pcagent --radar radar.json --out public/office/control/leads.json</span></div>
  </section>

  <section class="card" style="margin:18px 0 20px">
    <h2>СВОДКА CRM</h2>
    <table class="data" id="fin"></table>
  </section>
</main>

<script type="module">
import { money } from '../shared/data.js';
import { mountNav, mountFooter } from '../shared/nav.js';

mountNav('control');

const LEAD_LABELS = [
  ['new', 'Новые'],
  ['in_progress', 'В работе'],
  ['qualified', 'Квалифицированы'],
  ['won', 'Продажа'],
  ['lost', 'Потеряны'],
];

const bars = (el, items) => {
  const top = Math.max(1, ...items.map(i => i.v));
  el.innerHTML = items.map(i => `<div class="bar">
      <span>${i.label}</span>
      <span class="track"><span class="fill" style="width:${(i.v / top * 100).toFixed(1)}%"></span></span>
      <span class="n">${i.v}</span></div>`).join('');
};

function drawRevenue(series) {
  const cv = document.getElementById('rev');
  const g = cv.getContext('2d');
  const W = cv.width, H = cv.height;
  g.clearRect(0, 0, W, H);
  const rows = series.length ? series : [{ label: '—', value: 0 }];
  const PAD = { l: 74, r: 14, t: 16, b: 34 };
  const max = Math.max(1, ...rows.map(m => m.value)) * 1.12;
  const px = i => PAD.l + (W - PAD.l - PAD.r) * (i + 0.5) / rows.length;
  const py = v => H - PAD.b - (H - PAD.t - PAD.b) * (v / max);
  g.font = '13px ui-monospace, monospace';
  g.strokeStyle = '#16242a';
  g.fillStyle = '#74898c';
  for (let i = 0; i <= 4; i++) {
    const v = max * i / 4, y = py(v);
    g.beginPath(); g.moveTo(PAD.l, y); g.lineTo(W - PAD.r, y); g.stroke();
    g.fillText(Math.round(v).toLocaleString('ru-RU'), 8, y + 4);
  }
  const bw = (W - PAD.l - PAD.r) / rows.length * 0.45;
  rows.forEach((m, i) => {
    g.fillStyle = '#00ffcc';
    g.fillRect(px(i) - bw / 2, py(m.value), bw, H - PAD.b - py(m.value));
    g.fillStyle = '#74898c';
    g.textAlign = 'center';
    g.fillText(m.label, px(i), H - 12);
    g.textAlign = 'left';
  });
}

function paint(m) {
  const growth = m.revenue.prevMonth
    ? Math.round(m.revenue.thisMonth / m.revenue.prevMonth * 100 - 100) + '%'
    : '—';
  const kpis = [
    ['Приход за месяц', money(m.revenue.thisMonth)],
    ['Прошлый месяц', money(m.revenue.prevMonth)],
    ['Рост', growth],
    ['Контакты', m.contacts?.total ?? 0],
    ['Лиды', m.leads?.total ?? 0],
    ['Средний чек', money(m.revenue.avgTicket)],
  ];
  document.getElementById('kpis').innerHTML = kpis
    .map(([lbl, val]) => `<div class="card kpi"><span class="val">${val}</span><span class="lbl">${lbl}</span></div>`)
    .join('');
  drawRevenue(m.revenueMonths ?? []);
  const byStatus = m.leads?.byStatus ?? {};
  bars(document.getElementById('funnel'), LEAD_LABELS.map(([key, label]) => ({
    label, v: byStatus[key] ?? 0,
  })));
  bars(document.getElementById('top'), (m.week ?? []).map(day => ({
    label: day.label, v: day.value,
  })));
  const a = m.appointments;
  document.getElementById('fin').innerHTML = `
    <tr><th>Показатель</th><th class="num">Значение</th></tr>
    <tr><td>Клиентов</td><td class="num">${m.clients.total}</td></tr>
    <tr><td>Новых за месяц</td><td class="num">${m.clients.newThisMonth}</td></tr>
    <tr><td>Записей всего / впереди</td><td class="num">${a.total} / ${a.upcoming}</td></tr>
    <tr><td>Проведено / отменено</td><td class="num">${a.completed} / ${a.cancelled}</td></tr>
    <tr><td>Услуг в прайсе / активных</td><td class="num">${m.services.total} / ${m.services.active}</td></tr>
    <tr><td>Email / SMS / UTM</td><td class="num">${m.marketing.emailCampaigns} / ${m.marketing.smsCampaigns} / ${m.marketing.utmCampaigns}</td></tr>`;
  document.getElementById('src').textContent =
    'источник: /api/house/metrics · касса, налоги и складской учёт в базе не ведутся';
}

drawRevenue([]);
fetch('/api/house/metrics', { credentials: 'same-origin' })
  .then(r => r.ok ? r.json() : null)
  .then(m => {
    if (!m || !m.revenue) {
      document.getElementById('src').textContent =
        'войдите в CRM, чтобы увидеть свои цифры. Выдуманных оборотов на этой странице нет.';
      return;
    }
    paint(m);
  })
  .catch(() => {
    document.getElementById('src').textContent = 'не удалось прочитать /api/house/metrics';
  });

/* ---------- Лиды радара. Экспорт радара — чужие строки из профилей,
   в разметку они попадают только экранированными. ---------- */
const esc = v => String(v).replace(/[&<>"']/g, c =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);

fetch('leads.json').then(r => r.ok ? r.json() : null).then(leads => {
  if (!Array.isArray(leads) || !leads.length) return;
  const hot = leads.filter(l => l.intent === 'HOT');
  document.getElementById('leads-body').innerHTML =
    `<p class="mono">всего: ${leads.length} · HOT: <span class="good">${hot.length}</span></p>
     <table class="data">
       <tr><th>Название</th><th>Телефон</th><th>Город</th><th class="num">Интент</th></tr>
       ${leads.slice(0, 25).map(l => `<tr>
         <td>${esc(l.name ?? '—')}</td><td class="mono">${esc((l.phones ?? [l.phone]).filter(Boolean).join(', ') || '—')}</td>
         <td>${esc(l.city ?? '—')}</td>
         <td class="num ${l.intent === 'HOT' ? 'good' : 'dim'}">${esc(l.intent ?? '—')}</td></tr>`).join('')}
     </table>`;
  document.getElementById('src').textContent =
    `лидов из файла радара leads.json: ${leads.length}`;
}).catch(() => {});

mountFooter('цифры из CRM владельца. Файл leads.json радара, если он лежит рядом, показывается отдельно.');
</script>
</body>
</html>
